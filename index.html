<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>国宾壹号装修预算</title>
  <link rel="stylesheet" href="assets/tailwind.css">
  <style>
    :root {
      --bg:#f8fafc;
      --card:#fff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --main:#0f766e;
      --main-soft:#ccfbf1;
      --accent:#0f766e;
      --danger:#c2410c;
      --ok:#047857;
      --warn:#a16207;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      background:
        linear-gradient(180deg, #eef6f4 0, rgba(248,250,252,0) 280px),
        var(--bg);
      color:var(--text);
    }
    .wrap { max-width:1220px; margin:0 auto; padding:24px 16px 56px; }
    header {
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-end;
      margin-bottom:18px;
      padding:18px 0 8px;
    }
    h1 { margin:0; font-size:28px; letter-spacing:0; }
    .app-title-input {
      display:block;
      width:min(100%, 520px);
      border:0;
      border-radius:0;
      padding:0 0 4px;
      background:transparent;
      color:var(--text);
      font-size:28px;
      font-weight:800;
      line-height:1.25;
      min-height:0;
      box-shadow:none;
    }
    .app-title-input:focus {
      outline:0;
      box-shadow:inset 0 -2px 0 var(--main);
    }
    .app-title-input[readonly] {
      cursor:default;
      color:var(--text);
      background:transparent;
      opacity:1;
    }
    h2 { margin:0 0 12px; font-size:20px; letter-spacing:0; }
    h3 { margin:0; font-size:16px; letter-spacing:0; }
    p { margin:8px 0 0; color:var(--muted); line-height:1.6; }
    button, input, select { font:inherit; }
    button {
      border:1px solid var(--line);
      background:white;
      border-radius:8px;
      padding:9px 12px;
      cursor:pointer;
      min-height:38px;
      white-space:nowrap;
      color:var(--text);
      box-shadow:0 1px 2px rgba(15,23,42,.04);
      transition:background .12s ease, border-color .12s ease, color .12s ease, transform .12s ease, box-shadow .12s ease;
    }
    button.primary { background:var(--main); color:white; border-color:var(--main); }
    button.selected { background:var(--accent); color:white; border-color:var(--accent); }
    button.danger { color:var(--danger); }
    button:hover { filter:brightness(.98); box-shadow:0 4px 12px rgba(15,23,42,.08); }
    button:active { transform:translateY(1px); }
    input, select {
      border:1px solid var(--line);
      border-radius:8px;
      padding:9px 10px;
      background:white;
      min-width:0;
      color:var(--text);
      box-shadow:0 1px 2px rgba(15,23,42,.03);
      transition:border-color .12s ease, box-shadow .12s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline:0;
      border-color:var(--main);
      box-shadow:0 0 0 3px rgba(15,118,110,.14);
    }
    input:disabled,
    select:disabled,
    textarea:disabled,
    button:disabled {
      cursor:not-allowed;
      color:#94a3b8;
      background:#f8fafc;
      box-shadow:none;
      opacity:.78;
    }
    button:disabled:hover { filter:none; box-shadow:none; }
    input[type="number"] { width:110px; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid var(--line); padding:12px 8px; text-align:left; vertical-align:middle; }
    th { color:var(--muted); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.04em; background:#f8fafc; }
    code { background:#eef2f7; padding:2px 5px; border-radius:6px; }
    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:8px;
      padding:18px;
      box-shadow:0 10px 30px rgba(15,23,42,.06);
    }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .between { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0; }
    .stat .label { color:var(--muted); font-size:13px; }
    .stat .value { font-size:25px; font-weight:800; margin-top:8px; line-height:1.2; }
    .stat .value.compact { font-size:17px; line-height:1.45; }
    .stat.clickable { cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
    .stat.clickable:focus-visible { outline:3px solid rgba(31,58,95,.22); outline-offset:2px; }
    .stat.clickable:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(15,23,42,.08); }
    .stat {
      position:relative;
      overflow:hidden;
    }
    .stat::before {
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:4px;
      background:var(--main);
      opacity:.82;
    }
    .stat-line { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .stat-delta { white-space:nowrap; }
    .stat-delta.save { color:var(--ok); }
    .stat-delta.add { color:var(--danger); }
    .detail-panel { margin:-4px 0 16px; }
    .detail-panel-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:8px; }
    .item-lines { display:grid; gap:8px; }
    .item-line {
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:start;
      border-bottom:1px solid var(--line);
      padding:10px 0;
    }
    .item-line:last-child { border-bottom:0; }
    .item-line strong { font-size:16px; }
    .item-line-main { display:flex; gap:10px; align-items:flex-start; min-width:0; }
    .detail-thumb {
      width:48px;
      height:48px;
      border:1px solid var(--line);
      border-radius:8px;
      object-fit:cover;
      background:#f8fafc;
      flex:0 0 auto;
    }
    .item-meta { margin-top:4px; color:var(--muted); font-size:13px; line-height:1.5; }
    .summary-money { text-align:right; }
    .summary-money strong { display:block; }
    .summary-money span { color:var(--muted); font-size:12px; }
    .modal-backdrop {
      position:fixed;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(15,23,42,.42);
    }
    .modal {
      width:min(520px,100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:8px;
      padding:18px;
      box-shadow:0 20px 60px rgba(15,23,42,.25);
    }
    .modal.report-modal {
      width:min(760px,100%);
      max-height:92vh;
      overflow:auto;
    }
    .form-grid { display:grid; gap:12px; }
    .form-field label {
      display:block;
      margin-bottom:5px;
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }
    .form-field input,
    .form-field select,
    .form-field textarea {
      width:100%;
    }
    .form-field textarea {
      min-height:84px;
      resize:vertical;
    }
    .image-tools { display:grid; gap:8px; }
    .image-drop {
      border:1px dashed var(--line);
      border-radius:8px;
      padding:12px;
      color:var(--muted);
      background:#fafbfc;
      text-align:center;
    }
    .image-preview {
      width:96px;
      height:96px;
      border:1px solid var(--line);
      border-radius:8px;
      object-fit:cover;
      background:#f8fafc;
    }
    .item-thumb {
      width:58px;
      height:58px;
      border:1px solid var(--line);
      border-radius:8px;
      object-fit:cover;
      background:#f8fafc;
      display:block;
    }
    .thumb-button {
      border:0;
      background:transparent;
      padding:0;
      min-height:0;
      border-radius:8px;
    }
    .thumb-button:hover { filter:none; }
    .thumb-button:focus-visible { outline:3px solid rgba(31,58,95,.22); outline-offset:2px; }
    .item-thumb.empty {
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:12px;
    }
    .report-preview {
      width:100%;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      display:block;
    }
    .tabs, .category-tabs {
      display:flex;
      gap:8px;
      margin:16px 0;
      overflow:auto;
      padding:6px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.74);
      backdrop-filter:blur(10px);
      box-shadow:0 6px 18px rgba(15,23,42,.04);
    }
    .tabs { position:sticky; top:0; z-index:10; }
    .tabs button.active, .category-tabs button.active { background:var(--main); color:white; border-color:var(--main); }
    .tabs button, .category-tabs button { border-color:transparent; box-shadow:none; }
    .category-tabs button { background:#fff; }
    .budget-layout { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr); gap:14px; align-items:start; }
    .budget-head {
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
      margin-bottom:14px;
      padding-bottom:14px;
      border-bottom:1px solid var(--line);
    }
    .budget-hero {
      margin-top:4px;
      color:var(--main);
      font-size:34px;
      font-weight:900;
      line-height:1.1;
    }
    .budget-hints {
      display:grid;
      grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);
      gap:12px;
      margin-top:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#f8fafc;
    }
    .budget-hints strong {
      display:block;
      margin-top:5px;
      font-size:15px;
    }
    .budget-hints .value {
      margin-top:5px;
      font-size:14px;
      line-height:1.45;
    }
    .budget-total {
      border-top:1px solid var(--line);
      margin-top:12px;
      padding:14px 12px 4px;
      display:flex;
      justify-content:space-between;
      align-items:end;
      font-size:20px;
      font-weight:800;
      color:var(--main);
    }
    .summary-list { display:grid; gap:10px; }
    .summary-line {
      display:grid;
      grid-template-columns:96px 1fr auto;
      gap:10px;
      align-items:center;
      padding:12px;
      border-bottom:1px solid var(--line);
      border-radius:8px;
      background:#f8fafc;
    }
    .summary-line:last-child { border-bottom:0; }
    .plan-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    .plan-head { display:grid; grid-template-columns:1fr 138px auto auto; gap:8px; align-items:start; }
    .plan-title { width:100%; font-weight:750; font-size:16px; }
    .plan-total { display:flex; justify-content:space-between; align-items:end; border-bottom:1px solid var(--line); padding:14px 0 12px; margin-bottom:10px; }
    .plan-total .money { font-size:25px; font-weight:800; }
    .line { display:grid; grid-template-columns:1fr 90px 130px 44px; gap:8px; align-items:center; margin:8px 0; }
    .sync-box { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .small { font-size:13px; color:var(--muted); }
    .muted { color:var(--muted); }
    .hidden { display:none; }
    .status { font-size:13px; color:var(--muted); margin-top:8px; }
    .auth-status {
      display:inline-flex;
      align-items:center;
      min-height:32px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:5px 10px;
      background:rgba(255,255,255,.78);
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
    }
    .auth-status.editing {
      border-color:rgba(15,118,110,.28);
      background:#ccfbf1;
      color:#0f766e;
    }
    .ok { color:var(--ok); }
    .warn { color:var(--warn); }
    .empty { padding:22px; border:1px dashed var(--line); border-radius:8px; color:var(--muted); background:#f8fafc; }
    .help { line-height:1.8; }
    .table-wrap { overflow:auto; }
    @media (max-width:980px) {
      header, .budget-layout, .sync-box { display:block; }
      .grid, .plan-grid { grid-template-columns:1fr; }
      .card { padding:14px; }
      .plan-head { grid-template-columns:1fr 120px; }
      .line { grid-template-columns:1fr 76px 104px 40px; }
      .summary-line { grid-template-columns:76px 1fr; }
      .summary-line strong { justify-self:start; }
    }
    @media (max-width:640px) {
      .wrap { padding:18px 10px 44px; }
      h1 { font-size:24px; }
      .tabs, .category-tabs { gap:6px; }
      .tabs button, .category-tabs button { padding:8px 10px; }
      .between { align-items:stretch; flex-direction:column; }
      .budget-table-wrap { overflow:visible; }
      .budget-table, .budget-table tbody, .budget-table tr, .budget-table td { display:block; width:100%; }
      .budget-table thead { display:none; }
      .budget-table tbody { display:grid; gap:12px; }
      .budget-table tr {
        border:1px solid var(--line);
        border-radius:8px;
        background:#fff;
        padding:12px;
      }
      .budget-table td {
        border-bottom:0;
        padding:7px 0;
      }
      .budget-table td::before {
        content:attr(data-label);
        display:block;
        margin-bottom:5px;
        color:var(--muted);
        font-size:12px;
        font-weight:650;
      }
      .budget-table td:first-child {
        padding-top:0;
      }
      .budget-table td:first-child::before,
      .budget-table td:last-child::before {
        display:none;
      }
      .budget-table select,
      .budget-table button {
        width:100%;
        min-height:42px;
      }
      .budget-table td:nth-child(3) strong {
        font-size:20px;
      }
      .budget-total { font-size:22px; }
      .budget-head {
        align-items:stretch;
        flex-direction:column;
      }
      .budget-hero { font-size:32px; }
      .budget-hints { grid-template-columns:1fr; }
      .detail-panel { margin:0 0 14px; }
      .detail-panel-head { align-items:flex-start; flex-direction:column; }
      .item-line { grid-template-columns:1fr; gap:4px; }
      .item-line-main { align-items:flex-start; }
      .summary-line {
        grid-template-columns:1fr;
        gap:4px;
      }
      .summary-line strong {
        justify-self:start;
        font-size:18px;
      }
      .plan-head {
        grid-template-columns:1fr;
      }
      .plan-head input,
      .plan-head select,
      .plan-head button {
        width:100%;
        min-height:42px;
      }
      .plan-head button {
        justify-self:stretch;
      }
      .plan-total {
        align-items:flex-start;
        flex-direction:column;
        gap:6px;
      }
      .line {
        grid-template-columns:88px minmax(0,1fr) 42px;
        gap:8px;
        border:1px solid var(--line);
        border-radius:8px;
        padding:10px;
        background:#fafbfc;
      }
      .line select {
        grid-column:1 / -1;
        width:100%;
        min-height:42px;
      }
      .line input,
      .line button {
        width:100%;
        min-height:42px;
      }
      .line > div {
        align-self:center;
        min-width:0;
        overflow-wrap:anywhere;
      }
      .plan-grid .row button {
        flex:1 1 150px;
      }
      .item-table-wrap { overflow:visible; }
      .item-table, .item-table tbody, .item-table tr, .item-table td { display:block; width:100%; }
      .item-table thead { display:none; }
      .item-table tbody { display:grid; gap:12px; }
      .item-table tr {
        border:1px solid var(--line);
        border-radius:8px;
        background:#fff;
        padding:12px;
      }
      .item-table td {
        border-bottom:0;
        padding:7px 0;
      }
      .item-table td::before {
        content:attr(data-label);
        display:block;
        margin-bottom:5px;
        color:var(--muted);
        font-size:12px;
        font-weight:650;
      }
      .item-table input,
      .item-table select,
      .item-table input[type="number"] {
        width:100%;
        min-height:42px;
      }
      .item-table td:nth-child(2) input {
        font-weight:700;
      }
      .item-table td:last-child {
        padding-top:10px;
      }
      .item-table td:last-child::before {
        display:none;
      }
      .item-table td:last-child button {
        width:100%;
      }
      .modal-backdrop {
        align-items:flex-end;
        padding:10px;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-budget-soft text-budget-ink antialiased">
  <div class="wrap mx-auto max-w-7xl px-3 py-5 pb-14 sm:px-4 lg:px-6">
    <header class="flex flex-col gap-3 border-b border-budget-line/80 md:flex-row md:items-end md:justify-between">
      <div class="min-w-0">
        <input id="appTitleInput" class="app-title-input" value="国宾壹号装修预算" maxlength="40" onfocus="handleTitleFocus(event)" onblur="updateAppTitle(this.value)" onkeydown="handleTitleKey(event)" aria-label="预算标题">
        <p class="max-w-3xl text-sm leading-6 text-budget-muted">按空调、净水、厨电、卫浴、智能家居、家具等用途分类比较方案，并把每类选中的方案汇总成整屋预算。</p>
      </div>
      <div class="row md:justify-end">
        <span id="editModeStatus" class="auth-status">公开查看</span>
        <button id="editLoginButton" class="primary" onclick="openAuthModal()">登录编辑</button>
      </div>
    </header>

    <nav class="tabs">
      <button id="tabBudget" class="active" onclick="switchTab('budget')">整屋预算</button>
      <button id="tabPlans" onclick="switchTab('plans')">分类方案</button>
      <button id="tabItems" onclick="switchTab('items')">设备价格库</button>
    </nav>

    <main id="budgetView"></main>
    <main id="plansView" class="hidden"></main>
    <main id="itemsView" class="hidden"></main>
    <div id="syncStatus" class="hidden"></div>
  </div>
  <div id="authModalBackdrop" class="modal-backdrop hidden" onclick="closeAuthModal(event)">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle" onclick="event.stopPropagation()">
      <div class="between" style="margin-bottom:12px">
        <div>
          <h2 id="authModalTitle">登录编辑</h2>
          <p class="small">公开查看不需要登录；修改预算、上传图片或保存数据时需要编辑账号。</p>
        </div>
        <button onclick="closeAuthModal()">关闭</button>
      </div>
      <div class="form-grid">
        <div class="form-field">
          <label for="editUsername">用户名</label>
          <input id="editUsername" autocomplete="username" placeholder="请输入用户名">
        </div>
        <div class="form-field">
          <label for="editPassword">密码</label>
          <input id="editPassword" type="password" autocomplete="current-password" placeholder="请输入密码" onkeydown="handleAuthKey(event)">
        </div>
        <div id="authModalStatus" class="status">登录后会在当前浏览器会话中保持编辑权限。</div>
        <div class="row" style="justify-content:flex-end">
          <button onclick="closeAuthModal()">取消</button>
          <button class="primary" onclick="loginEditor()">登录</button>
        </div>
      </div>
    </section>
  </div>
  <div id="itemModalBackdrop" class="modal-backdrop hidden" onclick="closeItemModal(event)">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="itemModalTitle" onclick="event.stopPropagation()">
      <div class="between" style="margin-bottom:12px">
        <h2 id="itemModalTitle">新增设备</h2>
        <button onclick="closeItemModal()">关闭</button>
      </div>
      <div class="form-grid">
        <div class="form-field">
          <label for="newItemName">设备名称</label>
          <input id="newItemName" placeholder="例如：洗碗机">
        </div>
        <div class="form-field">
          <label for="newItemCategory">分类</label>
          <select id="newItemCategory"></select>
        </div>
        <div class="form-field">
          <label for="newItemPrice">单价</label>
          <input id="newItemPrice" type="number" min="0" placeholder="0">
        </div>
        <div class="form-field">
          <label for="newItemNote">备注</label>
          <input id="newItemNote" placeholder="品牌、安装、购买渠道等">
        </div>
        <div class="form-field">
          <label for="newItemShare">京东/淘宝分享链接或分享文案</label>
          <textarea id="newItemShare" onpaste="setTimeout(parseItemShare, 0)" placeholder="可粘贴京东、淘宝的分享文案；如果只粘贴纯链接，部分平台会因跨站限制无法自动拿到名称和价格"></textarea>
          <div class="row" style="margin-top:8px">
            <button onclick="parseItemShare()">分析填入</button>
            <span id="itemParseStatus" class="small"></span>
          </div>
        </div>
        <div class="form-field">
          <label for="newItemImageUrl">设备图片</label>
          <div class="image-tools">
            <input id="newItemImageUrl" placeholder="图片链接，例如 https://...jpg" onchange="setModalImageFromUrl()">
            <input id="newItemImageFile" type="file" accept="image/*" onchange="handleImageFile(event)">
            <div id="newItemImageDrop" class="image-drop" tabindex="0" onpaste="handleImagePaste(event)">点击这里后可直接粘贴图片</div>
            <img id="newItemImagePreview" class="image-preview hidden" alt="设备图片预览">

<script>
const STORAGE_KEY = 'renovation_budget_compare_gist_v2';
const LEGACY_STORAGE_KEY = 'renovation_budget_compare_gist_v1';
const CONFIG_KEY = 'renovation_budget_gist_config_v1';
const DEFAULT_APP_TITLE = '国宾壹号装修预算';
const DEFAULT_CATEGORIES = ['空调','净水','厨电','卫浴','智能家居','家具'];

let currentTab = 'budget';
let activeCategory = '空调';
let autoPushTimer = null;
let budgetDetailsOpen = false;
let itemModalPlanId = null;
let itemModalImage = '';
let editingImageItemId = null;
let editingItemImage = '';
let reportImageDataUrl = '';
let useServerApi = false;
let serverSaveTimer = null;
let isEditor = false;
let editorCredentials = loadEditorCredentials();
let data = normalizeData(loadLocal() || defaultData());

function defaultData(){
  return {
    version: 2,
    appTitle: DEFAULT_APP_TITLE,
    categories: DEFAULT_CATEGORIES.slice(),
    selections: {
      '空调':'plan-air-a',

      { id:'item-water-front', name:'前置过滤器', category:'净水', unitPrice:1000, note:'' },

      { id:'item-furniture-basic', name:'基础家具组合', category:'家具', unitPrice:45000, note:'沙发、餐桌、床、柜体外家具预估' }
    ],
    plans: [
      { id:'plan-air-a', category:'空调', name:'空调方案 A：一拖三中央空调', rows:[{ id:'row-air-a-1', itemId:'item-air-central-3', qty:1 }] },
      { id:'plan-air-b', category:'空调', name:'空调方案 B：风管机 + 3 台挂机', rows:[{ id:'row-air-b-1', itemId:'item-air-duct', qty:1 },{ id:'row-air-b-2', itemId:'item-air-wall', qty:3 },{ id:'row-air-b-3', itemId:'item-air-install', qty:1 }] },
      { id:'plan-water-a', category:'净水', name:'净水方案 A：前置 + 直饮', rows:[{ id:'row-water-a-1', itemId:'item-water-front', qty:1 },{ id:'row-water-a-2', itemId:'item-water-direct', qty:1 }] },
      { id:'plan-water-b', category:'净水', name:'净水方案 B：全屋净水', rows:[{ id:'row-water-b-1', itemId:'item-water-front', qty:1 },{ id:'row-water-b-2', itemId:'item-water-direct', qty:1 },{ id:'row-water-b-3', itemId:'item-water-central', qty:1 }] },
      { id:'plan-kitchen-c', category:'厨电', name:'厨电方案 C：烟灶洗碗机蒸烤冰箱', rows:[{ id:'row-kitchen-c-1', itemId:'item-kitchen-hood', qty:1 },{ id:'row-kitchen-c-2', itemId:'item-kitchen-dishwasher', qty:1 },{ id:'row-kitchen-c-3', itemId:'item-kitchen-steam', qty:1 },{ id:'row-kitchen-c-4', itemId:'item-kitchen-fridge', qty:1 }] },
      { id:'plan-smart-a', category:'智能家居', name:'智能方案 A：基础全屋智能', rows:[{ id:'row-smart-a-1', itemId:'item-smart-gateway', qty:1 },{ id:'row-smart-a-2', itemId:'item-smart-curtain', qty:1 },{ id:'row-smart-a-3', itemId:'item-smart-sensor', qty:1 }] },
      { id:'plan-bath-a', category:'卫浴', name:'卫浴方案 A：主卫基础组合', rows:[{ id:'row-bath-a-1', itemId:'item-bath-main', qty:1 }] },
      { id:'plan-furniture-a', category:'家具', name:'家具方案 A：基础家具组合', rows:[{ id:'row-furniture-a-1', itemId:'item-furniture-basic', qty:1 }] }
    ]
  };
}

function uid(prefix){ return prefix + '-' + Date.now() + '-' + Math.random().toString(16).slice(2); }
function money(n){ return new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',maximumFractionDigits:0}).format(Number(n||0)); }
function signedMoney(n){ return (n >= 0 ? '+' : '-') + money(Math.abs(n)); }
function appTitle(){ return data.appTitle || DEFAULT_APP_TITLE; }
function esc(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function jsArg(value){ return esc(JSON.stringify(value)); }
function editorDisabled(){ return isEditor ? '' : 'disabled'; }
function editorOnly(html){ return isEditor ? html : ''; }
function editHint(){ return isEditor ? '' : '<div class="small warn" style="margin-top:10px">当前为公开查看模式。登录编辑后可以修改和保存。</div>'; }
function loadEditorCredentials(){
  try { return JSON.parse(sessionStorage.getItem('renovation_budget_editor_auth_v1')) || null; } catch { return null; }
}
function authHeader(){
  if (!editorCredentials?.username || !editorCredentials?.password) return {};
  return { Authorization:'Basic ' + btoa(unescape(encodeURIComponent(editorCredentials.username + ':' + editorCredentials.password))) };
}
function requireEditor(message = '请先登录编辑账号。'){
  if (isEditor) return true;
  openAuthModal(message);
  return false;
}
function loadLocal(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY)); } catch { return null; }
}
function canUseServerApi(){ return location.protocol !== 'file:'; }
function normalizeData(next){
  const normalized = next && typeof next === 'object' ? next : defaultData();
  normalized.version = 2;
  normalized.appTitle = String(normalized.appTitle || DEFAULT_APP_TITLE).trim() || DEFAULT_APP_TITLE;
  normalized.items = Array.isArray(normalized.items) ? normalized.items : [];
  normalized.plans = Array.isArray(normalized.plans) ? normalized.plans : [];
  normalized.categories = Array.isArray(normalized.categories) ? normalized.categories : DEFAULT_CATEGORIES.slice();
  normalized.selections = normalized.selections && typeof normalized.selections === 'object' ? normalized.selections : {};

  normalized.items.forEach(item => {
    item.id = item.id || uid('item');
    item.name = item.name || '新设备';
    item.category = item.category || '空调';
    item.unitPrice = Number(item.unitPrice || 0);
    item.note = item.note || '';
    item.link = item.link || '';
    item.image = item.image || '';
  });

  const itemById = Object.fromEntries(normalized.items.map(item => [item.id, item]));
  normalized.plans.forEach(plan => {
    plan.id = plan.id || uid('plan');
    plan.rows = Array.isArray(plan.rows) ? plan.rows : [];
    plan.category = plan.category || itemById[plan.rows[0]?.itemId]?.category || '空调';
    plan.name = plan.name || '新方案';
    plan.rows.forEach(row => {
      row.id = row.id || uid('row');
      row.itemId = row.itemId || normalized.items.find(item => item.category === plan.category)?.id || normalized.items[0]?.id || '';
      row.qty = Number(row.qty || 0);
    });
  });

  const categorySet = new Set(DEFAULT_CATEGORIES);
  normalized.categories.forEach(category => categorySet.add(category));
  normalized.items.forEach(item => categorySet.add(item.category));
  normalized.plans.forEach(plan => categorySet.add(plan.category));
  normalized.categories = [...categorySet].filter(Boolean);

  if (!Object.keys(normalized.selections).length) {
    normalized.categories.forEach(category => {
      const first = normalized.plans.find(plan => plan.category === category);
      if (first) normalized.selections[category] = first.id;
    });
  }
  Object.keys(normalized.selections).forEach(category => {
    const selected = normalized.plans.find(plan => plan.id === normalized.selections[category] && plan.category === category);
    if (!selected) delete normalized.selections[category];
  });
  if (!normalized.categories.includes(activeCategory)) activeCategory = normalized.categories[0] || '空调';
  return normalized;
}
function save(options = {}){
  if (!isEditor) {
    showEditStatus('公开查看模式不能保存，请先登录编辑。', 'warn');
    openAuthModal();
    render();
    return;
  }
  data = normalizeData(data);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
  if (options.sync === false) return;
  if (useServerApi) scheduleServerSave();
  else scheduleAutoPush();
}
async function loadServerData(){
  if (!canUseServerApi()) return false;
  try{
    const res = await fetch('/api/data', { cache:'no-store' });
    if (!res.ok) return false;
    const next = await res.json();
    if (!Array.isArray(next.items) || !Array.isArray(next.plans)) return false;
    data = normalizeData(next);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    useServerApi = true;
    showEditStatus('已连接服务器数据。', 'ok');
    return true;
  }catch{
    return false;
  }
}
function scheduleServerSave(){
  clearTimeout(serverSaveTimer);
  serverSaveTimer = setTimeout(pushServerData, 800);
  showEditStatus('本地已保存，稍后同步到服务器。', 'warn');
}
async function pushServerData(){
  if (!useServerApi) return;
  if (!isEditor) {
    showEditStatus('请先登录编辑账号。', 'warn');
    openAuthModal();
    return;
  }
  try{
    const res = await fetch('/api/data', {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', ...authHeader() },
      body:JSON.stringify(data)
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error || ('服务器保存失败：' + res.status));
    }
    showEditStatus('已保存到服务器。 ' + new Date().toLocaleString(), 'ok');
  }catch(err){
    showEditStatus('保存到服务器失败：' + err.message, 'warn');
  }
}
function showEditStatus(message, tone = ''){
  const status = document.getElementById('editModeStatus');
  if (!status) return;
  status.textContent = message || (isEditor ? '编辑模式' : '公开查看');
  status.classList.toggle('editing', isEditor || tone === 'ok');
}
function renderAuthState(){
  const status = document.getElementById('editModeStatus');
  const button = document.getElementById('editLoginButton');
  if (status) {
    status.textContent = isEditor ? '编辑模式' : '公开查看';
    status.classList.toggle('editing', isEditor);
  }
  if (button) {
    button.textContent = isEditor ? '退出编辑' : '登录编辑';
    button.onclick = isEditor ? logoutEditor : openAuthModal;
  }
}
function openAuthModal(message = ''){
  const backdrop = document.getElementById('authModalBackdrop');
  if (!backdrop) return;
  document.getElementById('authModalStatus').textContent = message || '登录后会在当前浏览器会话中保持编辑权限。';
  document.getElementById('authModalStatus').className = message ? 'status warn' : 'status';
  document.getElementById('editUsername').value = editorCredentials?.username || '';
  document.getElementById('editPassword').value = editorCredentials?.password || '';
  backdrop.classList.remove('hidden');
  setTimeout(() => document.getElementById(editorCredentials?.username ? 'editPassword' : 'editUsername').focus(), 0);
}
function closeAuthModal(event){
  const backdrop = document.getElementById('authModalBackdrop');
  if (event && event.target !== backdrop) return;
  backdrop.classList.add('hidden');
}
function handleAuthKey(event){
  if (event.key === 'Enter') {
    event.preventDefault();
    loginEditor();
  }
}
async function loginEditor(){
  const username = document.getElementById('editUsername').value.trim();
  const password = document.getElementById('editPassword').value;
  const status = document.getElementById('authModalStatus');
  if (!username || !password) {
    status.textContent = '请填写用户名和密码。';
    status.className = 'status warn';
    return;
  }
  status.textContent = '正在验证...';
  status.className = 'status';
  const nextCredentials = { username, password };
  try{
    const res = await fetch('/api/auth/check', {
      headers:{ Authorization:'Basic ' + btoa(unescape(encodeURIComponent(username + ':' + password))) }
    });
    const json = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(json.error || '账号或密码不正确');
    editorCredentials = nextCredentials;
    sessionStorage.setItem('renovation_budget_editor_auth_v1', JSON.stringify(editorCredentials));
    isEditor = true;
    closeAuthModal();
    render();
    showEditStatus('已进入编辑模式。', 'ok');
  }catch(err){
    status.textContent = err.message || '登录失败';
    status.className = 'status warn';
  }
}
function logoutEditor(){
  isEditor = false;
  editorCredentials = null;
  sessionStorage.removeItem('renovation_budget_editor_auth_v1');
  render();
  showEditStatus('已退出编辑，当前公开查看。');
}
function itemMap(){ return Object.fromEntries(data.items.map(i => [i.id, i])); }
function categories(){ return data.categories; }
function plansByCategory(category){ return data.plans.filter(plan => plan.category === category); }
function planTotal(plan){
  const map = itemMap();
  return (plan.rows || []).reduce((sum,row) => sum + Number(map[row.itemId]?.unitPrice || 0) * Number(row.qty || 0), 0);
}
function categoryTotals(category){ return plansByCategory(category).map(plan => ({...plan,total:planTotal(plan)})).sort((a,b)=>a.total-b.total); }
function selectedPlan(category){ return data.plans.find(plan => plan.id === data.selections?.[category] && plan.category === category); }
function selectedSummaries(){
  return categories().map(category => {
    const plan = selectedPlan(category);
    return { category, plan, total: plan ? planTotal(plan) : 0 };
  });
}
function wholeTotal(){ return selectedSummaries().reduce((sum,row) => sum + row.total, 0); }
function percent(part, total){ return total ? (Number(part || 0) / total * 100).toFixed(1) + '%' : '0.0%'; }
function selectedItemLines(){
  const map = itemMap();
  return selectedSummaries()
    .filter(row => row.plan)
    .flatMap(summary => (summary.plan.rows || []).map(row => {
      const item = map[row.itemId];
      const qty = Number(row.qty || 0);
      const unitPrice = Number(item?.unitPrice || 0);
      return {
        category: summary.category,
        planName: summary.plan.name,
        itemName: item?.name || '未命名设备',
        image: item?.image || '',
        qty,
        unitPrice,
        total: unitPrice * qty
      };
    }))
    .filter(line => line.total > 0)
    .sort((a,b) => b.total - a.total);
}

function render(){
  renderAuthState();
  renderAppTitle();
  renderBudget();
  renderPlans();
  renderItems();
}
function renderAppTitle(){
  const title = appTitle();
  document.title = title;
  const input = document.getElementById('appTitleInput');
  if (input) {
    input.readOnly = !isEditor;
    if (document.activeElement !== input) input.value = title;
  }
}
function updateAppTitle(value){
  if (!isEditor) {
    renderAppTitle();
    return;
  }
  const title = String(value || '').trim() || DEFAULT_APP_TITLE;
  if (data.appTitle === title) {
    renderAppTitle();
    return;
  }
  data.appTitle = title;
  save();
}
function handleTitleFocus(event){
  if (isEditor) return;
  event.currentTarget.blur();
  openAuthModal('登录编辑后可以修改标题。');
}
function handleTitleKey(event){
  if (event.key === 'Enter') {
    event.preventDefault();
    event.currentTarget.blur();
  }
}
function budgetInsightHtml(rows){
  const missing = rows.filter(row => !row.plan).map(row => row.category);
  const sorted = categoryTotals(activeCategory);
  const selected = selectedPlan(activeCategory);
  const baseline = selected ? planTotal(selected) : (sorted[0]?.total || 0);
  const lowest = sorted[0];
  const highest = sorted[sorted.length - 1];
  return `
    <div class="budget-hints">
      <div>
        <div class="small">未选分类</div>
        <strong>${missing.length ? esc(missing.join('、')) : '已全部选择'}</strong>
      </div>
      <div>
        <div class="small">当前分类预算差异</div>
        <div class="value compact">${renderCategoryBudgetInsight(lowest, highest, baseline)}</div>
      </div>
    </div>`;
}
function renderCategoryBudgetInsight(lowest, highest, baseline){
  if (!lowest) return '-';
  const rows = [];
  const lowestDelta = lowest.total - baseline;
  rows.push(`<div class="stat-line"><span>最低：${esc(lowest.name)}</span><span class="stat-delta save">${signedMoney(lowestDelta)}</span></div>`);
  if (highest && highest.id !== lowest.id) {
    const highestDelta = highest.total - baseline;
    rows.push(`<div class="stat-line"><span>最高：${esc(highest.name)}</span><span class="stat-delta add">${signedMoney(highestDelta)}</span></div>`);
  }
  return rows.join('');
}
function renderSelectedItemsPanel(){
  if (!budgetDetailsOpen) return '';
  const lines = selectedItemLines();
  return `
    <section class="detail-panel">
      <div class="detail-panel-head">
        <h2>已选设备明细</h2>
        <div class="small">${lines.length} 项，按金额从高到低排列</div>
      </div>
      ${lines.length ? `<div class="item-lines">${lines.map(line => `
        <div class="item-line">
          <div class="item-line-main">
            ${line.image ? `<img class="detail-thumb" src="${esc(line.image)}" alt="${esc(line.itemName)}">` : ''}
            <div>
              <strong>${esc(line.itemName)}</strong>
              <div class="item-meta">${esc(line.category)} · ${esc(line.planName)}${line.qty !== 1 ? ` · 数量 ${line.qty}` : ''}</div>
            </div>
          </div>
          <strong>${money(line.total)}</strong>
        </div>
      `).join('')}</div>` : '<div class="empty">还没有已选设备。</div>'}
    </section>`;
}
function toggleBudgetDetails(){
  budgetDetailsOpen = !budgetDetailsOpen;
  renderBudget();
}
function handleBudgetCardKey(event){
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    toggleBudgetDetails();
  }
}
function renderCategoryTabs(){
  return `<nav class="category-tabs">
    ${categories().map(category => `<button class="${category === activeCategory ? 'active' : ''}" onclick="setActiveCategory(${jsArg(category)})">${esc(category)}</button>`).join('')}
    ${editorOnly('<button onclick="addCategory()">新增分类</button>')}
  </nav>`;
}
function renderBudget(){
  const rows = selectedSummaries();
  const total = wholeTotal();
  document.getElementById('budgetView').innerHTML = `
    <section class="card">
      <div class="budget-head">
        <div>
          <div class="small">整屋预算</div>
          <div class="budget-hero">${money(total)}</div>

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 2){
  const chars = String(text || '').split('');
  const lines = [];
  let line = '';
  chars.forEach(char => {
    const next = line + char;
    if (ctx.measureText(next).width > maxWidth && line) {
      lines.push(line);
      line = char;
    } else {
      line = next;
    }
  });
  if (line) lines.push(line);
  const visible = lines.slice(0, maxLines);
  if (lines.length > maxLines) visible[visible.length - 1] = visible[visible.length - 1].slice(0, -1) + '…';
  visible.forEach((part, index) => ctx.fillText(part, x, y + index * lineHeight));
  return visible.length * lineHeight;
}
function drawReportRow(ctx, y, cols, options = {}){
  const { x = 60, width = 960, height = 62, fill = '#ffffff', color = '#17202a', muted = false } = options;
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, width, height);
  ctx.strokeStyle = '#dfe4ea';
  ctx.beginPath();
  ctx.moveTo(x, y + height);
  ctx.lineTo(x + width, y + height);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = muted ? '24px Microsoft YaHei, Arial' : '28px Microsoft YaHei, Arial';
  cols.forEach(col => {
    ctx.textAlign = col.align || 'left';
    drawWrappedText(ctx, col.text, col.x, y + 39, col.width || 260, 30, col.lines || 1);
  });
}

function extractFirstUrl(text){
  return (String(text || '').match(/https?:\/\/[^\s，。"'<>]+/i) || [])[0] || '';
}
function extractFirstImageUrl(text){
  return (String(text || '').match(/https?:\/\/[^\s，。"'<>]+\.(?:jpg|jpeg|png|webp|gif)(?:\?[^\s，。"'<>]*)?/i) || [])[0] || '';
}
function parsePriceFromText(text){
  const value = String(text || '').match(/(?:¥|￥|RMB|CNY)\s*([0-9]+(?:\.[0-9]{1,2})?)/i)
    || String(text || '').match(/([0-9]+(?:\.[0-9]{1,2})?)\s*元/);
  return value ? Number(value[1]) : 0;
}
function parseNameFromText(text){
  const raw = String(text || '');
  const quoted = [...raw.matchAll(/[「《【]([^「」《》【】]{4,80})[」》】]/g)]
    .map(match => match[1].trim())
    .find(part => !/淘宝|天猫|京东|复制|打开|分享|链接/.test(part));
  if (quoted) return quoted;
  const cleaned = raw
    .replace(/https?:\/\/[^\s，。"'<>]+/ig, ' ')
    .replace(/(?:¥|￥|RMB|CNY)\s*[0-9]+(?:\.[0-9]{1,2})?/ig, ' ')
    .replace(/[0-9]+(?:\.[0-9]{1,2})?\s*元/g, ' ')
    .replace(/复制|打开|淘宝|天猫|京东|分享|链接|下单|领券|口令|【】|「」/g, ' ')
    .replace(/[￥¥#*~|]/g, ' ');
  return cleaned.split(/[\n\r，。；;]/)
    .map(part => part.trim())
    .filter(part => part.length >= 4 && !/^https?:/i.test(part))
    .sort((a,b) => b.length - a.length)[0] || '';
}

function resizeImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('图片读取失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片解析失败'));
      img.onload = () => {
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function prepareImageFile(file){
  if (!requireEditor('登录编辑后可以上传图片。')) throw new Error('请先登录编辑账号');
  if (!useServerApi) return resizeImageFile(file);
  const form = new FormData();
  form.append('image', file);
  const res = await fetch('/api/upload', { method:'POST', headers:authHeader(), body:form });
  const json = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(json.error || '图片上传失败');
  return json.url;
}
async function useImageFile(file){

}

  editingImageItemId = itemId;
  editingItemImage = item.image || '';
  document.getElementById('itemImageModalTitle').textContent = `编辑图片：${item.name}`;
  document.getElementById('editItemImageUrl').value = item.image && !item.image.startsWith('data:') ? item.image : '';
  document.getElementById('editItemImageFile').value = '';
  document.getElementById('editItemImageStatus').textContent = item.image ? '当前已有图片，可替换或清除。' : '当前没有图片。';
  document.getElementById('editItemImageStatus').className = 'small';
  updateEditImagePreview(editingItemImage);
  document.getElementById('itemImageModalBackdrop').classList.remove('hidden');
}
function closeItemImageModal(event){
  const backdrop = document.getElementById('itemImageModalBackdrop');
  if (event && event.target !== backdrop) return;
  editingImageItemId = null;
  editingItemImage = '';
  backdrop.classList.add('hidden');
}
function setEditImage(source, message = ''){
  editingItemImage = source || '';
  updateEditImagePreview(editingItemImage);
  const status = document.getElementById('editItemImageStatus');
  status.textContent = message;
  status.className = message ? 'small ok' : 'small';
}
function updateEditImagePreview(source){
  const preview = document.getElementById('editItemImagePreview');
  preview.classList.toggle('hidden', !source);
  if (source) preview.src = source;
  else preview.removeAttribute('src');
}
function setEditImageFromUrl(){
  const url = document.getElementById('editItemImageUrl').value.trim();
  setEditImage(url, url ? '已使用图片链接。' : '');
}
async function useEditImageFile(file){
  if (!file || !file.type?.startsWith('image/')) return;
  const status = document.getElementById('editItemImageStatus');
  status.textContent = useServerApi ? '正在上传图片...' : '正在压缩图片...';
  status.className = 'small';
  try{
    const dataUrl = await prepareImageFile(file);
    document.getElementById('editItemImageUrl').value = '';
    setEditImage(dataUrl, useServerApi ? '图片已上传到服务器。' : '图片已粘贴/上传并压缩。');
  }catch(err){
    status.textContent = err.message || '图片处理失败';
    status.className = 'small warn';
  }
}
function handleEditImageFile(event){
  useEditImageFile(event.target.files?.[0]);
}
function handleEditImagePaste(event){
  const items = Array.from(event.clipboardData?.items || []);
  const imageItem = items.find(item => item.type.startsWith('image/'));
  if (!imageItem) return;
  event.preventDefault();
  useEditImageFile(imageItem.getAsFile());
}
function clearItemImage(){
  document.getElementById('editItemImageUrl').value = '';
  setEditImage('', '已清除图片，保存后生效。');
}
function saveItemImage(){
  if (!requireEditor()) return;
  const item = data.items.find(next => next.id === editingImageItemId);
  if (!item) return;
  item.image = editingItemImage || document.getElementById('editItemImageUrl').value.trim();
  save({sync:false});
  closeItemImageModal();
  if (useServerApi) {
    showEditStatus('图片已保存，正在同步到服务器。', 'warn');
    pushServerData();
  } else if (hasCloudSyncConfig()) {
    showEditStatus('图片已保存，正在同步到 Gist。', 'warn');
    autoPushGist();
  }
}
function createItemFromModal(){
  if (!requireEditor()) return;
  const name = document.getElementById('newItemName').value.trim() || '新设备';
  const category = document.getElementById('newItemCategory').value || activeCategory;
  const unitPrice = Number(document.getElementById('newItemPrice').value || 0);
  const note = document.getElementById('newItemNote').value.trim();
  if (!data.categories.includes(category)) data.categories.push(category);
  activeCategory = category;
  const image = itemModalImage || document.getElementById('newItemImageUrl').value.trim();
  const item = { id:uid('item'), name, category, unitPrice, note, link:extractFirstUrl(document.getElementById('newItemShare').value), image };
  data.items.push(item);
  const plan = data.plans.find(next => next.id === itemModalPlanId);
  if (plan) {
    plan.rows.push({ id:uid('row'), itemId:item.id, qty:1 });
  }
  itemModalPlanId = null;
  document.getElementById('itemModalBackdrop').classList.add('hidden');
  save();
}
function updateItem(id,key,val){
  if (!requireEditor()) return;
  const item = data.items.find(next => next.id === id);
  if (!item) return;
  item[key] = val;
  save();
}
function removeItem(id){
  if (!requireEditor()) return;
  data.items = data.items.filter(item => item.id !== id);
  data.plans.forEach(plan => plan.rows = plan.rows.filter(row => row.itemId !== id));
  save();
}
function addPlan(){
  if (!requireEditor('登录编辑后可以新增方案。')) return;
  const firstItem = data.items.find(item => item.category === activeCategory) || data.items[0];
  const plan = { id:uid('plan'), category:activeCategory, name:activeCategory + '新方案', rows:[] };
  if (firstItem) plan.rows.push({ id:uid('row'), itemId:firstItem.id, qty:1 });
  data.plans.push(plan);
  save();
}
function updatePlan(id,key,val){
  if (!requireEditor()) return;
  const plan = data.plans.find(next => next.id === id);
  if (!plan) return;
  const oldCategory = plan.category;
  plan[key] = val;
  if (key === 'category') {
    if (!data.categories.includes(val)) data.categories.push(val);
    if (data.selections?.[oldCategory] === id) delete data.selections[oldCategory];
    activeCategory = val;
  }
  save();
}
function removePlan(id){
  if (!requireEditor()) return;
  const plan = data.plans.find(next => next.id === id);
  data.plans = data.plans.filter(next => next.id !== id);
  if (plan && data.selections?.[plan.category] === id) delete data.selections[plan.category];
  save();
}
function duplicatePlan(id){
  if (!requireEditor()) return;
  const plan = data.plans.find(next => next.id === id);
  if (!plan) return;
  data.plans.push({
    ...plan,
    id:uid('plan'),
    name:plan.name + ' 副本',
    rows:plan.rows.map(row => ({...row,id:uid('row')}))
  });
  save();
}
function addRow(planId){
  if (!requireEditor()) return;
  const plan = data.plans.find(next => next.id === planId);
  if (!plan) return;
  const firstItem = data.items.find(item => item.category === plan.category) || data.items[0];
  plan.rows.push({ id:uid('row'), itemId:firstItem?.id || '', qty:1 });
  save();
}
function updateRow(planId,rowId,key,val){
  if (!requireEditor()) return;
  const plan = data.plans.find(next => next.id === planId);
  const row = plan?.rows.find(next => next.id === rowId);
  if (!row) return;
  row[key] = val;
  save();
}
function removeRow(planId,rowId){
  if (!requireEditor()) return;
  const plan = data.plans.find(next => next.id === planId);
  if (!plan) return;
  plan.rows = plan.rows.filter(row => row.id !== rowId);
  save();
}

function exportJson(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '装修方案组合预算.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importJson(e){
  if (!requireEditor('登录编辑后可以导入数据。')) return;
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const next = normalizeData(JSON.parse(reader.result));
      if (!Array.isArray(next.items) || !Array.isArray(next.plans)) throw new Error('JSON 格式不正确');
      data = next;
      save();
    }catch(err){
      alert('导入失败：' + (err.message || 'JSON 格式不正确'));
    }
  };
  reader.readAsText(file);
}

function loadGistConfig(){
  try{
    const config = JSON.parse(localStorage.getItem(CONFIG_KEY));
    if (config) {
      document.getElementById('gistId').value = config.gistId || '';
      document.getElementById('gistFilename').value = config.filename || 'renovation-budget.json';
      document.getElementById('gistToken').value = config.token || '';
    }
  }catch{}
}
function getGistConfig(){
  const gistId = document.getElementById('gistId');
  const gistFilename = document.getElementById('gistFilename');
  const gistToken = document.getElementById('gistToken');
  return {
    gistId:gistId?.value.trim() || '',
    filename:gistFilename?.value.trim() || 'renovation-budget.json',
    token:gistToken?.value.trim() || ''
  };
}
function saveGistConfig(){
  const config = getGistConfig();
  if (!config.token) { alert('请填写 GitHub token'); return false; }
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  document.getElementById('syncStatus').innerHTML = '<span class="ok">Gist 设置已保存到本机浏览器。</span>';
  return true;
}
function hasCloudSyncConfig(){
  const config = getGistConfig();
  return Boolean(config.token && config.gistId && config.filename);
}
function scheduleAutoPush(){
  if (!hasCloudSyncConfig()) return;
  clearTimeout(autoPushTimer);
  autoPushTimer = setTimeout(autoPushGist, 1200);
  document.getElementById('syncStatus').innerHTML = '<span class="warn">本地已保存，稍后自动同步到 Gist。</span>';
}
async function gistRequest(method, url, body){
  const config = getGistConfig();
  if (!config.token) throw new Error('请先填写 GitHub token');
  const res = await fetch(url, {
    method,
    headers: { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+config.token, 'X-GitHub-Api-Version':'2022-11-28' },
    body: body ? JSON.stringify(body) : undefined
  });
  const json = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(json.message || ('GitHub API 错误：' + res.status));
  return json;
}
async function createGist(){
  try{
    if (!saveGistConfig()) return;
    const config = getGistConfig();
    const body = {
      description:'Renovation budget data',
      public:false,
      files:{ [config.filename]: { content: JSON.stringify(data,null,2) } }
    };
    const json = await gistRequest('POST','https://api.github.com/gists',body);
    document.getElementById('gistId').value = json.id;
    localStorage.setItem(CONFIG_KEY, JSON.stringify({...config,gistId:json.id}));
    document.getElementById('syncStatus').innerHTML = '<span class="ok">已新建 Secret Gist。</span> Gist ID：' + json.id;
  }catch(err){ document.getElementById('syncStatus').textContent = '新建失败：' + err.message; }
}
async function pullGist(){
  try{
    if (!saveGistConfig()) return;
    const config = getGistConfig();
    if (!config.gistId) throw new Error('请填写 Gist ID，或先点击“新建 Gist”');
    const json = await gistRequest('GET','https://api.github.com/gists/'+encodeURIComponent(config.gistId));
    const file = json.files[config.filename] || Object.values(json.files)[0];
    if (!file) throw new Error('Gist 中没有可读取的文件');
    const content = file.content ?? await (await fetch(file.raw_url)).text();
    data = normalizeData(JSON.parse(content));
    save({sync:false});
    if (useServerApi) await pushServerData();
    document.getElementById('syncStatus').innerHTML = '<span class="ok">已从 Gist 读取。</span> 文件：' + esc(file.filename);
  }catch(err){ document.getElementById('syncStatus').textContent = '读取失败：' + err.message; }
}
async function autoPushGist(){
  if (!hasCloudSyncConfig()) return;
  try{
    const config = getGistConfig();
    const body = { files:{ [config.filename]: { content: JSON.stringify(data,null,2) } } };
    await gistRequest('PATCH','https://api.github.com/gists/'+encodeURIComponent(config.gistId),body);
    document.getElementById('syncStatus').innerHTML = '<span class="ok">已自动保存到 Gist。</span> ' + new Date().toLocaleString();
  }catch(err){
    document.getElementById('syncStatus').textContent = '自动保存到 Gist 失败：' + err.message;
  }
}
async function pushGist(){
  try{
    if (!saveGistConfig()) return;
    const config = getGistConfig();
    if (!config.gistId) throw new Error('请填写 Gist ID，或先点击“新建 Gist”');
    const body = { files:{ [config.filename]: { content: JSON.stringify(data,null,2) } } };
    await gistRequest('PATCH','https://api.github.com/gists/'+encodeURIComponent(config.gistId),body);
    document.getElementById('syncStatus').innerHTML = '<span class="ok">已保存到 Gist。</span> ' + new Date().toLocaleString();
  }catch(err){ document.getElementById('syncStatus').textContent = '保存失败：' + err.message; }
}

async function initApp(){
  if (editorCredentials) {
    isEditor = await verifyStoredEditor();
    if (!isEditor) editorCredentials = null;
  }
  render();
  if (await loadServerData()) render();
}
async function verifyStoredEditor(){
  try{
    const res = await fetch('/api/auth/check', { headers:authHeader() });
    return res.ok;
  }catch{
    return false;
  }
}
initApp();
</script>
