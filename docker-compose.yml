services:
  renovation-budget:
    build: .
    container_name: renovation-budget
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_PASSPHRASE: "${APP_PASSPHRASE:-gbyh}"
      DATA_DIR: /app/runtime
      PORT: 3000
    volumes:
      - ./runtime:/app/runtime
