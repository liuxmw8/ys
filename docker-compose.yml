services:
  renovation-budget:
    build: .
    container_name: renovation-budget
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_USERNAME: "${APP_USERNAME:-gbyh}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      DATA_DIR: /app/runtime
      PORT: 3000
    volumes:
      - ./runtime:/app/runtime
